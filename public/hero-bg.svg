<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Subtle dot grid -->
  <g opacity="0.35">
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2E4540"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#dotGrid)"/>
  </g>

  <!-- Soft radial glow, top right -->
  <ellipse cx="1500" cy="150" rx="600" ry="400" fill="#2E4540" opacity="0.05"/>
  <!-- Soft radial glow, bottom left -->
  <ellipse cx="300" cy="950" rx="550" ry="380" fill="#2E4540" opacity="0.05"/>

  <!-- Abstract code-inspired geometric lines (like connected nodes / circuit) -->
  <g stroke="#2E4540" stroke-width="1.5" opacity="0.12">
    <path d="M 100 200 L 300 200 L 300 350 L 550 350"/>
    <path d="M 1700 250 L 1500 250 L 1500 420 L 1300 420"/>
    <path d="M 150 850 L 350 850 L 350 700 L 600 700"/>
    <path d="M 1750 800 L 1550 800 L 1550 650 L 1350 650"/>
    <path d="M 900 100 L 900 220 L 1050 220"/>
    <path d="M 850 950 L 850 830 L 720 830"/>
  </g>

  <!-- Node dots at line intersections -->
  <g fill="#2E4540" opacity="0.18">
    <circle cx="100" cy="200" r="4"/>
    <circle cx="300" cy="200" r="4"/>
    <circle cx="300" cy="350" r="4"/>
    <circle cx="550" cy="350" r="4"/>
    <circle cx="1700" cy="250" r="4"/>
    <circle cx="1500" cy="250" r="4"/>
    <circle cx="1500" cy="420" r="4"/>
    <circle cx="1300" cy="420" r="4"/>
    <circle cx="150" cy="850" r="4"/>
    <circle cx="350" cy="850" r="4"/>
    <circle cx="350" cy="700" r="4"/>
    <circle cx="600" cy="700" r="4"/>
    <circle cx="1750" cy="800" r="4"/>
    <circle cx="1550" cy="800" r="4"/>
    <circle cx="1550" cy="650" r="4"/>
    <circle cx="1350" cy="650" r="4"/>
    <circle cx="900" cy="100" r="4"/>
    <circle cx="900" cy="220" r="4"/>
    <circle cx="1050" cy="220" r="4"/>
    <circle cx="850" cy="950" r="4"/>
    <circle cx="850" cy="830" r="4"/>
    <circle cx="720" cy="830" r="4"/>
  </g>

  <!-- Faint angle brackets, code motif, corners -->
  <g fill="none" stroke="#2E4540" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.08">
    <path d="M 80 80 L 40 120 L 80 160"/>
    <path d="M 1840 80 L 1880 120 L 1840 160"/>
    <path d="M 80 920 L 40 960 L 80 1000"/>
    <path d="M 1840 920 L 1880 960 L 1840 1000"/>
  </g>

  <!-- Gentle vignette toward edges for center focus -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
</svg>